<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Film</title>
  <link rel="stylesheet" href="create.css">

</head>
<body>

  <div class="form-container">
    <h2>Create Film</h2>
    <form id="createForm">
      <label for="title">Title</label>
      <input type="text" id="title" placeholder="Film title...">

      <label for="duration">Duration (min)</label>
      <input type="text" id="duration" placeholder="e.g. 120">

      <label for="reviews">Reviews count</label>
      <input type="text" id="reviews" placeholder="e.g. 100000">

      <label for="description">Description</label>
      <textarea id="description" rows="4" placeholder="Short description..."></textarea>

      <label for="image">Image</label>    
      <select id="image">
        <option value="images/absolute.png" selected>Default Image</option>
    </select>

      <button type="submit">Submit</button>
    </form>
  </div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <p id="modalMessage"></p>
      <button onclick="closeModal()">OK</button>
    </div>
  </div>
  <script src="create.js"></script>

</body>
</html>
